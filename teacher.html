<!doctype html><html lang="zh-Hant"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>考卷打包工具（老師用）</title>
<style>body{font:16px/1.7 system-ui,"PingFang TC","Microsoft JhengHei",sans-serif;max-width:640px;margin:24px auto;padding:0 16px;color:#17283d}h1{font-size:22px}label{display:block;margin:14px 0 4px;font-weight:700}input,select,button,textarea{font:inherit;padding:8px 10px;border:1px solid #9fb0c3;border-radius:8px;max-width:100%}button{background:#1f4f8a;color:#fff;border:0;cursor:pointer;padding:10px 18px}.box{background:#f1f5f9;border-radius:10px;padding:14px;margin-top:18px}small{color:#5b6b7e}</style>
<h1>考卷打包工具</h1><p>這個工具只在你的電腦瀏覽器裡運作，考卷不會傳到任何網站。</p>
<label>1. 選擇考卷 PDF</label><input type="file" id="pdf" accept=".pdf,application/pdf">
<label>2. 檔名代號 <small>（不要寫科目、年級、班級）</small></label><input id="nm" value="e1">
<label>3. 學生頁面網址</label><input id="site" size="46" placeholder="https://你的帳號.github.io/倉庫名/student.html">
<label>語速</label><select id="rate"><option>0.6</option><option>0.7</option><option>0.8</option><option selected>0.9</option><option>1</option><option>1.1</option><option>1.2</option></select>
<label>每句念</label><select id="rep"><option value="1">1 次</option><option value="2">2 次</option></select>
<p><button id="go">打包並加密</button> <span id="msg"></span></p>
<div class="box" id="out" hidden><p><b>完成。</b>已下載 <span id="fn"></span>。請把它用 AirDrop 傳到每台 iPad（存進「檔案」App）。</p>
<p>考試當天，用 iPad 相機掃這個 QR code 開考。<b>考前請勿公開這個 QR code。</b>金鑰沒有存在任何地方，弄丟了只能重新打包。</p><div id="qr"></div><textarea id="url" rows="3" cols="50" readonly></textarea></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script>
const $=id=>document.getElementById(id);$('site').value=localStorage.getItem('site')||'';
const b64u=u=>btoa(String.fromCharCode(...u)).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
$('go').onclick=async()=>{
  const f=$('pdf').files[0],site=$('site').value.trim();
  if(!f){$('msg').textContent='請先選擇 PDF';return}
  if(!/^https:\/\//.test(site)){$('msg').textContent='學生頁面網址要以 https:// 開頭';return}
  localStorage.setItem('site',site);$('msg').textContent='處理中…';
  try{
    const pdf=new Uint8Array(await f.arrayBuffer()),nm=$('nm').value.trim()||'e1';
    const hdr=new TextEncoder().encode(JSON.stringify({name:nm,rate:Number($('rate').value),rep:Number($('rep').value),edits:{}}));
    const raw=crypto.getRandomValues(new Uint8Array(32)),iv=crypto.getRandomValues(new Uint8Array(12));
    const key=await crypto.subtle.importKey('raw',raw,'AES-GCM',false,['encrypt']);
    const plain=new Uint8Array(4+hdr.length+pdf.length);new DataView(plain.buffer).setUint32(0,hdr.length);plain.set(hdr,4);plain.set(pdf,4+hdr.length);
    const ct=new Uint8Array(await crypto.subtle.encrypt({name:'AES-GCM',iv},key,plain));
    const out=new Uint8Array(16+ct.length);out.set(new TextEncoder().encode('BDX1'),0);out.set(iv,4);out.set(ct,16);
    const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([out]));a.download=nm+'.baodu';a.click();
    const url=site+'#k='+b64u(raw);$('qr').innerHTML='';new QRCode($('qr'),{text:url,width:260,height:260,correctLevel:QRCode.CorrectLevel.M});
    $('url').value=url;$('fn').textContent=nm+'.baodu';$('out').hidden=false;$('msg').textContent='';
  }catch(e){$('msg').textContent='打包失敗：'+e.message}
};
</script>
